<app-data-table
  [columns]="columns"
  [actions]="actions"
  [dataSource]="dataSource">
</app-data-table>

<ng-template #createdAtTpl let-row>
  <span>{{ row.createdAt | date }}</span>
</ng-template>

<ng-template #updatedAtTpl let-row>
  <span>{{ row.updatedAt | date }}</span>
</ng-template>

<ng-template #titleTpl let-row>
  <span class="link-like" (click)="openPlagiarismModal(row)">
    {{ row.title }}
  </span>
</ng-template>

@if (openedRow(); as row) {
  <ng-container>
    <app-plagiarism-check-modal
      [plagiarismCheck]="(check$ | async)!"
      [isChecked]="!!(check$ | async)"
      [loading]="loading()"
      (close)="closePlagiarismModal()"
      (check)="onPlagiarismCheckAction()">
    </app-plagiarism-check-modal>
  </ng-container>
}
